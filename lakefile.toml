name = "compilingWithSquares"
version = "0.2.0"
defaultTargets = ["SquareApplications"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "SquareApplications"
roots = ["SquareApplications"]
globs = ["SquareApplications", "Squares", "Compiler", "SquareCompiler", "FirstOrder", "Dependent", "Verification", "SquareKit.+", "Applications.+", "Examples.+", "ProofAudit"]
