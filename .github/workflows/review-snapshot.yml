name: Review snapshot regressions

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Public CLI tests in disposable Git repositories
        run: nix develop --command python3 scripts/test-review-snapshot.py
